name: Build BugToolkit APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q BugToolkit.zip

      - name: Fix Kotlin source and JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Fix missing AlertDialog import
          source = Path("BugToolkit/app/src/main/java/com/jaccksallas/bugtoolkit/MainActivity.kt")
          code = source.read_text()

          if "import android.app.AlertDialog" not in code:
              code = code.replace(
                  "import android.app.Activity",
                  "import android.app.Activity\nimport android.app.AlertDialog",
                  1
              )

          source.write_text(code)

          # Fix Java and Kotlin JVM target mismatch
          gradle_file = Path("BugToolkit/app/build.gradle.kts")
          gradle_code = gradle_file.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in gradle_code:
              gradle_code = gradle_code.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
                  1
              )

          gradle_file.write_text(gradle_code)

          print("Source code and JVM fixes applied.")
          PY

      - name: Build APK
        working-directory: BugToolkit
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BugToolkit-APK
          path: BugToolkit/app/build/outputs/apk/debug/app-debug.apk
